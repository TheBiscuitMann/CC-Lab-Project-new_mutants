<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Compiler</title>
<style>
  :root {
    --bg:#0d1017; --bg-2:#12161f; --panel:#161b26; --panel-2:#1a2030;
    --line:#242c3a; --line-soft:#1e2530;
    --ink:#e6edf3; --ink-dim:#8592a6; --ink-faint:#56617a;
    --accent:#6cf0a8; --accent-2:#6cb6ff; --accent-3:#c58fff; --warn:#ffb454; --err:#ff6a6a;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(108,182,255,.06), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(197,143,255,.05), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--sans);
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:16px; padding:0 20px; height:52px;
    border-bottom:1px solid var(--line); background:rgba(13,16,23,.6);
    backdrop-filter:blur(8px); flex-shrink:0;
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;letter-spacing:.2px;}
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .logo .tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:2px 7px;margin-left:2px;}
  .pipeline{margin-left:auto;display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);}
  .pipeline .stage{color:var(--ink-dim);transition:color .3s;}
  .pipeline .stage.lit{color:var(--accent-2);text-shadow:0 0 8px rgba(108,182,255,.5);}
  .pipeline .sep{color:var(--line);}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0;}
  .editor{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg-2);}
  .bar{display:flex;align-items:center;gap:10px;height:38px;padding:0 16px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;color:var(--ink-dim);flex-shrink:0;}
  .bar .fname{color:var(--ink);}
  .bar .fdim{color:var(--ink-faint);}
  .editor-wrap{position:relative;flex:1;min-height:0;display:flex;}
  textarea{flex:1;width:100%;background:transparent;color:var(--ink);border:none;resize:none;outline:none;padding:16px 16px 16px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.7;tab-size:4;}
  textarea::placeholder{color:var(--ink-faint);}
  .toolbar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line-soft);background:var(--panel);flex-shrink:0;}
  .btn-run{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#7df3b4,#4fd894);color:#053019;border:none;font-family:var(--sans);font-weight:650;font-size:13px;padding:9px 18px;border-radius:7px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 4px 14px rgba(79,216,148,.25);transition:transform .06s,filter .18s,box-shadow .18s;}
  .btn-run:hover{filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 6px 20px rgba(79,216,148,.35);}
  .btn-run:active{transform:translateY(1px);}
  .btn-run:disabled{opacity:.5;cursor:default;filter:grayscale(.3);}
  .btn-run kbd{font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.18);padding:1px 5px;border-radius:4px;color:#0a3a20;}
  .btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);font-family:var(--mono);font-size:11px;padding:8px 12px;border-radius:7px;cursor:pointer;transition:.15s;}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink-faint);background:var(--panel-2);}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
  .status .led{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);transition:.25s;}
  .status.ok .led{background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .status.err .led{background:var(--err);box-shadow:0 0 8px var(--err);}
  .status.busy .led{background:var(--warn);box-shadow:0 0 8px var(--warn);animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.35;}}
  .output{display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  .tabs{display:flex;align-items:stretch;height:38px;border-bottom:1px solid var(--line-soft);flex-shrink:0;padding:0 8px;gap:2px;}
  .tab{display:inline-flex;align-items:center;gap:7px;padding:0 14px;cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;user-select:none;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);border-bottom-color:var(--tabc,var(--accent-2));}
  .tab .pip{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);transition:.2s;}
  .tab.active .pip{background:var(--tabc,var(--accent-2));box-shadow:0 0 7px var(--tabc,var(--accent-2));}
  .tab .count{font-size:10px;color:var(--ink-faint);background:var(--panel-2);border-radius:20px;padding:0 6px;min-width:18px;text-align:center;}
  .panels{flex:1;position:relative;min-height:0;}
  .panel{position:absolute;inset:0;overflow-y:auto;padding:16px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .22s ease,transform .22s ease;}
  .panel.show{opacity:1;pointer-events:auto;transform:none;}
  .panel::-webkit-scrollbar{width:10px;}
  .panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg);}
  .placeholder{color:var(--ink-faint);font-size:12px;line-height:1.9;}
  .line-ok{color:var(--accent);}
  .line-bad{color:var(--err);}
  .line-warn{color:var(--warn);}
  .tac-temp{color:var(--accent-3);}
  .tac-label{color:var(--accent-2);}
  .empty-all{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink-faint);text-align:center;font-family:var(--mono);font-size:12px;}
  .empty-all .big{font-size:28px;opacity:.5;}
  @media (max-width:860px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr;}
    .editor{border-right:none;border-bottom:1px solid var(--line);}
    .pipeline{display:none;}
  }
</style>
</head>
<body>
  <header>
    <div class="logo"><span class="dot"></span>Mini Compiler<span class="tag">flex · bison · c</span></div>
    <div class="pipeline" id="pipeline">
      <span class="stage" data-s="lex">lexer</span><span class="sep">›</span>
      <span class="stage" data-s="parse">parser</span><span class="sep">›</span>
      <span class="stage" data-s="ast">ast</span><span class="sep">›</span>
      <span class="stage" data-s="sem">semantic</span><span class="sep">›</span>
      <span class="stage" data-s="tac">tac</span>
    </div>
  </header>
  <main>
    <section class="editor">
      <div class="bar"><span class="fname">program.mc</span><span class="fdim">— source</span></div>
      <div class="editor-wrap">
        <textarea id="code" spellcheck="false" placeholder="Write a program, or load a sample below…"></textarea>
      </div>
      <div class="toolbar">
        <button class="btn-run" id="runBtn">Compile <kbd>Ctrl↵</kbd></button>
        <button class="btn-ghost" id="sampleBtn">Sample</button>
        <button class="btn-ghost" id="errBtn">Error example</button>
        <div class="status" id="status"><span class="led"></span><span id="statusText">ready</span></div>
      </div>
    </section>
    <section class="output">
      <div class="tabs" id="tabs">
        <div class="tab active" data-tab="ast" style="--tabc:var(--accent-3)"><span class="pip"></span>AST</div>
        <div class="tab" data-tab="sem" style="--tabc:var(--accent-2)"><span class="pip"></span>Semantic</div>
        <div class="tab" data-tab="tac" style="--tabc:var(--accent)"><span class="pip"></span>TAC</div>
        <div class="tab" data-tab="raw" style="--tabc:var(--ink-dim)"><span class="pip"></span>Raw</div>
      </div>
      <div class="panels" id="panels">
        <div class="panel show" data-panel="ast"><div class="empty-all"><span class="big">⌘</span>Compile a program to see its syntax tree.</div></div>
        <div class="panel" data-panel="sem"><div class="placeholder">Semantic analysis results appear here.</div></div>
        <div class="panel" data-panel="tac"><div class="placeholder">Generated three-address code appears here.</div></div>
        <div class="panel" data-panel="raw"><div class="placeholder">Full raw compiler output appears here.</div></div>
      </div>
    </section>
  </main>
<script>
  const SAMPLE=`int x;
int y;
bool flag;
x = 10;
y = 0;
flag = true;
while (x > 0) {
    y = y + x;
    x = x - 1;
}
if (flag == true) {
    print y;
} else {
    print x;
}`;
  const ERR=`int x;
x = 5;
y = 10;`;
  const codeEl=document.getElementById('code');
  const runBtn=document.getElementById('runBtn');
  const statusEl=document.getElementById('status');
  const statusText=document.getElementById('statusText');
  document.getElementById('sampleBtn').onclick=()=>{codeEl.value=SAMPLE;codeEl.focus();};
  document.getElementById('errBtn').onclick=()=>{codeEl.value=ERR;codeEl.focus();};
  const tabs=[...document.querySelectorAll('.tab')];
  const panels=[...document.querySelectorAll('.panel')];
  tabs.forEach(t=>t.onclick=()=>{
    tabs.forEach(x=>x.classList.remove('active'));
    panels.forEach(p=>p.classList.remove('show'));
    t.classList.add('active');
    document.querySelector(`.panel[data-panel="${t.dataset.tab}"]`).classList.add('show');
  });
  function setCount(tab,n){
    const el=document.querySelector(`.tab[data-tab="${tab}"]`);
    let c=el.querySelector('.count');
    if(n==null){if(c)c.remove();return;}
    if(!c){c=document.createElement('span');c.className='count';el.appendChild(c);}
    c.textContent=n;
  }
  function fill(panelName,text,kind){
    const panel=document.querySelector(`.panel[data-panel="${panelName}"]`);
    panel.innerHTML='';
    if(!text||!text.trim()){panel.innerHTML='<div class="placeholder">—</div>';return;}
    for(const line of text.split('\n')){
      const span=document.createElement('span');
      const t=line.trim();
      if(/error/i.test(t))span.className='line-bad';
      else if(/completed successfully|0 errors|✓/i.test(t))span.className='line-ok';
      else if(/warning|conflict/i.test(t))span.className='line-warn';
      if(kind==='tac'){
        span.innerHTML=line.replace(/\b(t\d+)\b/g,'<span class="tac-temp">$1</span>').replace(/\b(L\d+)\b/g,'<span class="tac-label">$1</span>');
      }else{span.textContent=line;}
      panel.appendChild(span);
      panel.appendChild(document.createTextNode('\n'));
    }
  }
  function splitSections(out){
    const parts={pre:'',ast:'',sem:'',tac:''};
    let cur='pre';
    for(const line of out.split('\n')){
      const m=line.trim().match(/^---\s*(.*?)\s*---$/);
      if(m){
        const name=m[1].toLowerCase();
        if(name.includes('syntax tree'))cur='ast';
        else if(name.includes('semantic'))cur='sem';
        else if(name.includes('three address'))cur='tac';
        else cur='pre';
        continue;
      }
      parts[cur]+=line+'\n';
    }
    return parts;
  }
  function lightPipeline(parts){
    const stages={lex:true,parse:!/parsing failed/i.test(parts.pre+parts.ast),ast:!!parts.ast.trim(),sem:!!parts.sem.trim(),tac:!!parts.tac.trim()};
    document.querySelectorAll('.pipeline .stage').forEach(s=>s.classList.toggle('lit',!!stages[s.dataset.s]));
  }
  async function compile(){
    const code=codeEl.value;
    if(!code.trim()){setStatus('busy','nothing to compile');return;}
    runBtn.disabled=true;
    setStatus('busy','compiling…');
    try{
      const res=await fetch('/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
      const data=await res.json();
      const out=data.output||'(no output)';
      const parts=splitSections(out);
      fill('ast',parts.ast||parts.pre,'ast');
      fill('sem',parts.sem,'sem');
      fill('tac',parts.tac,'tac');
      fill('raw',out,'raw');
      const tacLines=parts.tac.trim()?parts.tac.trim().split('\n').length:null;
      setCount('tac',tacLines);
      const hadError=/error/i.test(out)||/parsing failed/i.test(out);
      lightPipeline(parts);
      setStatus(hadError?'err':'ok',hadError?'errors found':'compiled');
      const jump=hadError?(parts.sem.trim()?'sem':'ast'):(parts.tac.trim()?'tac':'ast');
      document.querySelector(`.tab[data-tab="${jump}"]`).click();
    }catch(e){
      fill('raw','Could not reach the compiler server. Is server.py running?','raw');
      document.querySelector('.tab[data-tab="raw"]').click();
      setStatus('err','offline');
    }finally{runBtn.disabled=false;}
  }
  function setStatus(cls,txt){statusEl.className='status '+cls;statusText.textContent=txt;}
  runBtn.onclick=compile;
  codeEl.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();compile();return;}
    if(e.key==='Tab'){e.preventDefault();const s=codeEl.selectionStart,en=codeEl.selectionEnd;codeEl.value=codeEl.value.slice(0,s)+'    '+codeEl.value.slice(en);codeEl.selectionStart=codeEl.selectionEnd=s+4;}
  });
</script>
</body>
</html>
