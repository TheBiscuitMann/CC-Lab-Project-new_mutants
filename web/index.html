<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Compiler</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2230;
    --line: #2a3240;
    --ink: #e6edf3;
    --ink-dim: #8b98a9;
    --accent: #7ee787;      /* signal green - "it compiled" */
    --accent-2: #6cb6ff;    /* pipeline blue */
    --warn: #ffa657;
    --err: #ff7b72;
    --mono: "SFMono-Regular", "JetBrains Mono", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 22px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  header .sub {
    font-size: 12px;
    color: var(--ink-dim);
    font-family: var(--mono);
  }
  header .pipeline {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  header .pipeline span { color: var(--accent-2); }
  header .pipeline .arrow { color: var(--line); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }

  /* ---- Editor side ---- */
  .editor-pane {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    min-height: 0;
  }
  .pane-label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-dim);
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  textarea {
    flex: 1;
    background: var(--panel);
    color: var(--ink);
    border: none;
    resize: none;
    padding: 18px;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.7;
    outline: none;
    tab-size: 4;
  }
  textarea::placeholder { color: var(--ink-dim); }

  .toolbar {
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
    background: var(--panel);
  }
  button.run {
    background: var(--accent);
    color: #06210b;
    border: none;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    padding: 9px 20px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform .05s ease, filter .15s ease;
  }
  button.run:hover { filter: brightness(1.08); }
  button.run:active { transform: translateY(1px); }
  button.run:disabled { opacity: .5; cursor: default; }
  .sample-btn {
    background: transparent;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .sample-btn:hover { color: var(--ink); border-color: var(--ink-dim); }
  .status {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
  }

  /* ---- Output side ---- */
  .output-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel-2);
  }
  .output-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* section headers the compiler prints (--- X ---) get highlighted by JS */
  .sec {
    color: var(--accent-2);
    font-weight: 600;
    display: block;
    margin: 14px 0 4px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 3px;
  }
  .sec:first-child { margin-top: 0; }
  .ok  { color: var(--accent); }
  .bad { color: var(--err); }
  .warnline { color: var(--warn); }
  .empty-state {
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.8;
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .editor-pane { border-right: none; border-bottom: 1px solid var(--line); }
    header .pipeline { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Mini Compiler</h1>
    <span class="sub">flex · bison · c</span>
    <div class="pipeline">
      <span>lex</span><span class="arrow">→</span>
      <span>parse</span><span class="arrow">→</span>
      <span>ast</span><span class="arrow">→</span>
      <span>semantic</span><span class="arrow">→</span>
      <span>tac</span>
    </div>
  </header>

  <main>
    <section class="editor-pane">
      <div class="pane-label">source · program.mc</div>
      <textarea id="code" spellcheck="false" placeholder="Type a program here, or load a sample below..."></textarea>
      <div class="toolbar">
        <button class="run" id="runBtn">Compile</button>
        <button class="sample-btn" id="sampleBtn">Load sample</button>
        <button class="sample-btn" id="errorBtn">Load error example</button>
        <span class="status" id="status">ready</span>
      </div>
    </section>

    <section class="output-pane">
      <div class="pane-label">compiler output</div>
      <div class="output-scroll" id="output"><div class="empty-state">Output from the compiler appears here.

Each phase prints its own section:
  --- Abstract Syntax Tree ---
  --- Semantic Analysis ---
  --- Three Address Code ---

Write a program and press Compile.</div></div>
    </section>
  </main>

<script>
  const SAMPLE = `int x;
int y;
bool flag;
x = 10;
y = 0;
flag = true;
while (x > 0) {
    y = y + x;
    x = x - 1;
}
if (flag == true) {
    print y;
} else {
    print x;
}`;

  const ERROR_SAMPLE = `int x;
x = 5;
y = 3;`;   // y is never declared -> semantic error

  const codeEl = document.getElementById('code');
  const outEl = document.getElementById('output');
  const statusEl = document.getElementById('status');
  const runBtn = document.getElementById('runBtn');

  document.getElementById('sampleBtn').onclick = () => { codeEl.value = SAMPLE; codeEl.focus(); };
  document.getElementById('errorBtn').onclick  = () => { codeEl.value = ERROR_SAMPLE; codeEl.focus(); };

  // Render output, highlighting section headers, success, and error lines.
  function render(text) {
    outEl.innerHTML = '';
    const lines = text.split('\n');
    for (const line of lines) {
      const el = document.createElement('span');
      const t = line.trim();
      if (/^---.*---$/.test(t)) {
        el.className = 'sec';
        el.textContent = t.replace(/^---\s*/, '').replace(/\s*---$/, '');
      } else if (/completed successfully|0 errors/i.test(t)) {
        el.className = 'ok'; el.textContent = line;
      } else if (/error/i.test(t)) {
        el.className = 'bad'; el.textContent = line;
      } else if (/warning|conflict/i.test(t)) {
        el.className = 'warnline'; el.textContent = line;
      } else {
        el.textContent = line;
      }
      outEl.appendChild(el);
      outEl.appendChild(document.createTextNode('\n'));
    }
  }

  async function compile() {
    const code = codeEl.value;
    if (!code.trim()) { statusEl.textContent = 'nothing to compile'; return; }
    runBtn.disabled = true;
    statusEl.textContent = 'compiling…';
    outEl.innerHTML = '<span class="empty-state">Running compiler…</span>';
    try {
      const res = await fetch('/compile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const data = await res.json();
      render(data.output || '(no output)');
      statusEl.textContent = data.ok ? 'done' : 'error';
    } catch (e) {
      outEl.innerHTML = '<span class="bad">Could not reach the compiler server. Is server.py running?</span>';
      statusEl.textContent = 'offline';
    } finally {
      runBtn.disabled = false;
    }
  }

  runBtn.onclick = compile;
  // Ctrl/Cmd+Enter to compile
  // Ctrl/Cmd+Enter to compile; Tab inserts 4 spaces instead of moving focus
  codeEl.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); compile(); return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = codeEl.selectionStart, end = codeEl.selectionEnd;
      codeEl.value = codeEl.value.slice(0, start) + '    ' + codeEl.value.slice(end);
      codeEl.selectionStart = codeEl.selectionEnd = start + 4;
    }
  });
</script>
</body>
</html>
